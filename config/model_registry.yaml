models:
  summarization:
    model_name: "sshleifer/distilbart-cnn-12-6"
    fallback_model: "t5-small"
    quality_metric: "ROUGE-L"
    description: "DistilBART CNN fine-tuned for abstractive summarization (Fallback: T5-small)."
    max_input_length: 1024
    max_output_length: 150
    min_output_length: 30

  sentiment:
    model_name: "cardiffnlp/twitter-roberta-base-sentiment-latest"
    fallback_model: "distilbert-base-uncased-finetuned-sst-2-english"
    quality_metric: "Accuracy"
    description: "RoBERTa fine-tuned for sentiment analysis (Fallback: DistilBERT-SST2)."
    max_input_length: 512

  translation:
    model_name: "t5-base"
    fallback_model: "t5-small"
    quality_metric: "BLEU"
    description: "T5 sequence-to-sequence transformer model for multi-lingual translation (Fallback: T5-small)."
    max_input_length: 512
    max_output_length: 256
